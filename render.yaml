# Render service definition, mirroring the live service as configured on
# 24 Aug 2026 (dashboard service srv-da24ksbncjis738h3p00, "traveller").
#
# The build command is the line that matters: migrations must run BEFORE the
# new code starts, or a deploy ships code that queries columns the database
# does not have yet. It is already set correctly in the dashboard — this file
# records it in the repository so it cannot be lost to an accidental edit of a
# settings field nobody remembers.
#
# NOTE: Render applies this file only to services created from a Blueprint.
# This service was created by hand, so the dashboard settings remain the source
# of truth for it; keep the two in step by hand.
services:
  - type: web
    name: traveller
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    # --include=optional is load-bearing, not decoration. Every native binary
    # (lightningcss, esbuild, swc) is an optional dependency, and `npm ci` on
    # Linux installs none of them from a lock file resolved on Windows — the
    # build then dies in next build with "Cannot find module
    # '../lightningcss.linux-x64-gnu.node'". A warm build cache hid this for
    # weeks; it surfaced the moment a dependency changed and invalidated it.
    buildCommand: npm ci --include=optional && npm run db:migrate && npm run build
    startCommand: npm run start
    # Not currently configured on the live service. /api/health returns 503
    # when Postgres is unreachable, so it is worth switching on: a process that
    # is up but cannot reach the database serves errors on every page.
    healthCheckPath: /api/health
    envVars:
      # Everything else is set in the dashboard and must never be committed
      # here: DATABASE_URL, SESSION_SECRET, SUPPORT_PHONE, SUPPORT_EMAIL,
      # ENFORCE_CANONICAL_HOST, the COMPANY_* details printed into the driver
      # agreement, and file storage —
      #   STORAGE_DRIVER=s3, S3_BUCKET, S3_ENDPOINT, S3_REGION,
      #   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
      # The service refuses to start with STORAGE_DRIVER=s3 and any of those
      # missing, so a half-configured deploy fails loudly instead of losing
      # driver documents.
      # Must match what the live service actually runs: the npm major that
      # ships with it decides how package-lock.json is resolved, and a lock
      # file written by a different major is rejected by `npm ci`.
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://routeplanner.ge
